<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Upraviť skupinu</title>
    <style>
        body { background:#222; color:#fff; font-family:sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; }
        .card { background:#383838; border-radius:16px; padding:32px; width:320px; box-shadow:0 10px 25px rgba(0,0,0,0.5); }
        h2 { text-align:center; margin:0 0 24px; font-size:20px; }
        input[type="text"], textarea { width:100%; background:#282828; border:none; border-radius:8px; padding:12px; color:#fff; box-sizing:border-box; font-size:14px; outline:none; margin-bottom:12px; }
        textarea { resize:vertical; min-height:50px; }
        .members-list { background:#282828; border-radius:8px; padding:12px; margin-bottom:12px; max-height:120px; overflow-y:auto; }
        .member-item { display:flex; justify-content:space-between; align-items:center; font-size:12px; padding:4px 0; border-bottom:1px solid #333; }
        .member-item:last-child { border-bottom:none; }
        .member-role { color:#888; font-size:11px; }
        .add-section { margin-bottom:16px; }
        .add-section label { font-size:11px; color:#888; text-transform:uppercase; letter-spacing:0.06em; display:block; margin-bottom:8px; }
        .member-row { display:flex; gap:8px; margin-bottom:8px; }
        .member-row input { margin:0; flex:1; }
        .btn-remove { background:#444; border:none; color:#fff; border-radius:6px; padding:0 10px; cursor:pointer; }
        .btn-add-row { background:none; border:1px solid #555; color:#aaa; border-radius:6px; padding:6px 14px; font-size:12px; cursor:pointer; margin-bottom:16px; }
        .actions { display:flex; justify-content:center; gap:16px; }
        .btn-submit { background:#5c9ded; color:#fff; border:none; border-radius:99px; padding:8px 24px; font-size:13px; font-weight:600; cursor:pointer; }
        .btn-cancel { background:transparent; color:#fff; border:1px solid #fff; border-radius:99px; padding:8px 24px; font-size:13px; font-weight:600; text-decoration:none; }
        .error { color:#e05252; font-size:13px; margin-bottom:12px; }
    </style>
</head>
<body>
<div class="card">
    <h2>Upraviť skupinu</h2>

    <form method="post">
        {% csrf_token %}

        {% if error %}<p class="error">{{ error }}</p>{% endif %}

        <input type="text" name="name" value="{{ group.name }}" required>
        <textarea name="description">{{ group.description }}</textarea>

        <div class="add-section">
            <label>Aktuálni členovia</label>
            <div class="members-list">
                {% for m in memberships %}
                    <div class="member-item">
                        <span>{{ m.user.username }}</span>
                        <span class="member-role">{{ m.role }}</span>
                    </div>
                {% endfor %}
            </div>
        </div>

        <div class="add-section">
            <label>Pridať / zmeniť členov</label>
            <div id="member-inputs">
                {% for m in memberships %}
                    {% if m.user != request.user %}
                    <div class="member-row">
                        <input type="text" name="member_usernames" value="{{ m.user.username }}">
                        <button type="button" class="btn-remove" onclick="this.parentElement.remove()">−</button>
                    </div>
                    {% endif %}
                {% endfor %}
            </div>
            <button type="button" class="btn-add-row" onclick="addRow()">+ Pridať ďalšieho</button>
        </div>

        <div class="actions">
            <button type="submit" class="btn-submit">Uložiť</button>
            <a href="/" class="btn-cancel">Zrušiť</a>
        </div>
    </form>
</div>

<script>
function addRow() {
    const div = document.createElement('div');
    div.className = 'member-row';
    div.innerHTML = `
        <input type="text" name="member_usernames" placeholder="Zadaj username..."
               style="flex:1;background:#282828;border:none;border-radius:8px;padding:10px;color:#fff;font-size:14px;outline:none;">
        <button type="button" class="btn-remove" onclick="this.parentElement.remove()">−</button>
    `;
    document.getElementById('member-inputs').appendChild(div);
}
</script>
</body>
</html>

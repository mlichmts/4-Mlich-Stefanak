<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nová skupina</title>
    <style>
        body {
            background-color: #222222;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .modal-card {
            background-color: #383838;
            border-radius: 16px;
            padding: 32px;
            width: 320px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .modal-card h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 22px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 16px;
        }

        input[type="text"],
        textarea {
            width: 100%;
            background-color: #282828;
            border: none;
            border-radius: 8px;
            padding: 14px;
            color: #ffffff;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        input[type="text"]::placeholder,
        textarea::placeholder {
            color: #555555;
            font-weight: 500;
        }

        textarea {
            resize: vertical;
            min-height: 50px;
        }

        .members-container {
            background-color: #282828;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 24px;
            max-height: 140px;
            overflow-y: auto;
        }

        .members-container::-webkit-scrollbar { width: 4px; }
        .members-container::-webkit-scrollbar-track { background: transparent; }
        .members-container::-webkit-scrollbar-thumb { background: #555; border-radius: 2px; }

        

        .member-label {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 500;
        }

        .member-label:last-child {
            margin-bottom: 0;
        }

        .member-label input[type="checkbox"] {
            margin-right: 10px;
            width: 14px;
            height: 14px;
            cursor: pointer;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        button[type="submit"],
        .btn-cancel {
            padding: 8px 24px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }

        button[type="submit"]:hover,
        .btn-cancel:hover {
            opacity: 0.8;
        }

        button[type="submit"] {
            background-color: #5c9ded;
            color: #ffffff;
            border: none;
        }

        .btn-cancel {
            background-color: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
        }
    </style>
</head>
<body>

    <div class="modal-card">
        <h2>Vytvorit skupinu</h2>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <input type="text" name="name" placeholder="MENO..." required>
            </div>

            <div class="form-group">
                <textarea name="description" placeholder="POPIS..."></textarea>
            </div>

            <div class="members-container">
                
                {% for user in all_users %}
                    <label class="member-label">
                        <input type="checkbox" name="members" value="{{ user.id }}">
                        {{ user.username }}
                        {% if user.first_name %} ({{ user.first_name }} {{ user.last_name }}){% endif %}
                    </label>
                {% endfor %}
            </div>

            <div class="actions">
                <button type="submit">&#43; Create</button>
                <a href="{% url 'task_list' %}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>

</body>
</html>
